# Render Blueprint. The database is external (Neon) and comes in via DATABASE_URL.
# Keep the Neon project in AWS Europe Central 1 (Frankfurt), next to this service.
services:
  - type: web
    name: talentflow
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.16"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      # Private R2/S3 bucket for resumes. Leave unset to use local disk
      # (Render's disk is wiped on every deploy, so set these for the live demo).
      - key: RESUMES_S3_BUCKET
        sync: false
      - key: RESUMES_S3_ENDPOINT_URL
        sync: false
      - key: RESUMES_S3_ACCESS_KEY_ID
        sync: false
      - key: RESUMES_S3_SECRET_ACCESS_KEY
        sync: false
      - key: RESUMES_S3_REGION
        value: auto
