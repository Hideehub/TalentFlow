<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invite not valid | TalentFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'recruitment/css/app.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="container login-shell d-flex align-items-center justify-content-center py-5">
        <div class="login-card p-4 p-md-5 w-100" style="max-width: 440px;">
            <p class="section-kicker mb-1">Invite</p>
            <h1 class="h4 fw-bold mb-1">This invite is no longer valid</h1>
            <p class="text-secondary mb-4">It has expired or has already been used. Ask your HR Admin to send you a new invite.</p>
            <a class="btn btn-primary w-100" href="{% url 'accounts:login' %}">Go to sign in</a>
        </div>
    </main>
</body>
</html>
